<!DOCTYPE html>
<html lang="ko">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>영의 빛 연구소: 이중슬릿의 비밀</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: #F2F4F8;
	background-color: #1D2735;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #1D2735;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
	font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#load-title {
	font-size: 2rem;
	font-weight: 700;
	color: #FFB84D;
	margin-bottom: 0.4rem;
	z-index: 1;
}

#load-subtitle {
	font-size: 1rem;
	color: #A8B4C4;
	margin-bottom: 2rem;
	z-index: 1;
}

#status-progress {
	display: none;
	position: static;
	width: min(60%, 420px);
	height: 14px;
	appearance: none;
	border: 1px solid #8A6A35;
	border-radius: 7px;
	background-color: #10161f;
	z-index: 1;
}

#status-progress::-webkit-progress-bar {
	background-color: #10161f;
	border-radius: 7px;
}

#status-progress::-webkit-progress-value {
	background-color: #FFB84D;
	border-radius: 7px;
}

#progress-pct {
	display: none;
	margin-top: 0.7rem;
	font-size: 1.1rem;
	color: #F2F4F8;
	z-index: 1;
}

#slow-notice {
	display: none;
	margin-top: 1.4rem;
	font-size: 0.95rem;
	color: #A8B4C4;
	z-index: 1;
}

#status-notice {
	display: none;
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}
		</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

	</head>
	<body>
		<canvas id="canvas">
			이 브라우저는 canvas를 지원하지 않습니다.
		</canvas>

		<noscript>
			이 브라우저는 JavaScript를 지원하지 않습니다.
		</noscript>

		<div id="status">
			<img id="status-splash" class="show-image--false fullsize--true use-filter--true" src="index.png" alt="">
			<div id="load-title">영의 빛 연구소</div>
			<div id="load-subtitle">— 이중슬릿의 비밀 —</div>
			<progress id="status-progress"></progress>
			<div id="progress-pct"></div>
			<div id="slow-notice">새로고침 말고 잠시만 — 큰 짐을 나르는 중이라네.</div>
			<div id="status-notice"></div>
		</div>

		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":3907132,"index.wasm":37686550},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');
	const progressPct = document.getElementById('progress-pct');
	const slowNotice = document.getElementById('slow-notice');

	let initializing = true;
	let statusMode = '';

	// 30초 경과 보조 문구 (§2-1 — 변화 없는 화면은 새로고침 연타를 부른다)
	const slowTimer = setTimeout(() => {
		if (initializing) {
			slowNotice.style.display = 'block';
		}
	}, 30000);

	// Android 뒤로가기(엣지 스와이프) 대응 (§2-5):
	// pushState 1개를 쌓아 두고 popstate가 오면 게임에 일시정지를 요청한 뒤 다시 쌓는다.
	history.pushState({ game: true }, '');
	window.addEventListener('popstate', () => {
		window.dispatchEvent(new Event('godot_pause_request'));
		history.pushState({ game: true }, '');
	});

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			clearTimeout(slowTimer);
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		progressPct.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('알 수 없는 오류가 발생했습니다.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		const missingMsg = '이 브라우저에서는 실행할 수 없습니다:\n';
		displayFailureNotice(missingMsg + missing.join('\n'));
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
					progressPct.textContent = Math.round(current / total * 100) + '%';
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
					progressPct.textContent = '준비 중…';
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
